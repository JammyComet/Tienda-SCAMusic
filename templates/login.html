{% extends "base.html" %}

{% block title %}login{% endblock %}

{% block contenido %}
    <main>
        <section class="contacto py-4 px-3 text-center">
            <h2 class="titulo-lineas fw-bold mb-0">SCAMusica TIENDA VIRTUAL</h2>
        </section>

        <form class="form-contenedor border p-4 mx-auto mb-4">
            <h2 class="text-center fw-bold mb-4">Inicio de Sesión</h2>

            <div class="mb-3">
                <label for="usuarioL" class="form-label">Correo:</label>
                <input type="email" id="usuarioL" name="usuarioL" maxlength="100" required class="form-control">
            </div>

            <div class="mb-3">
                <label for="contrasenaL" class="form-label">Contraseña:</label>
                <input type="password" id="contrasenaL" name="contrasenaL" minlength="4" maxlength="10" required class="form-control">
            </div>

            <div class="text-center">
                <button type="button" onclick="validarLogin()" class="btn btn-dark px-4">Iniciar Sesión</button>
            </div>
        </form>
    </main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/usuarios.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
{% endblock %}
