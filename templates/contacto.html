{% extends "base.html" %}

{% block title %}Contacto{% endblock %}

{% block contenido %}
    <main>
        <section class="ayuda bg-dark text-white py-4">
            <div class="container">
                <div class="row align-items-center justify-content-center g-4">
                    <div class="col-12 col-lg-6">
                        <h2 class="titulo2 mb-3">
                            ESTAMOS AQUI
                            <span class="d-block">PARA AYUDARTE</span>
                        </h2>
                        <p class="fs-5 mb-0">Si tienes alguna pregunta o necesitas ayuda, no dudes en contactarnos.</p>
                    </div>

                    <div class="col-12 col-lg-5 text-center">
                        <img src="{{ url_for('static', filename='imagenes/vibrando.jpg') }}" alt="Persona escuchando musica" class="img-fluid ayuda-img">
                    </div>
                </div>
            </div>
        </section>

        <section class="contacto py-4 px-3 text-center">
            <h2 class="titulo-lineas fw-bold mb-0">SPAMUSIC</h2>
        </section>

        <form class="form-contenedor border p-4 mx-auto mb-4">
            <h2 class="text-center fw-bold mb-4">Formulario de Contacto</h2>

            <div class="mb-3">
                <label for="nombreC" class="form-label">Nombre Completo:</label>
                <input type="text" id="nombreC" name="nombreC" maxlength="100" required class="form-control">
            </div>

            <div class="mb-3">
                <label for="emailC" class="form-label">Correo:</label>
                <input type="email" id="emailC" name="emailC" maxlength="100" class="form-control">
            </div>

            <div class="mb-3">
                <label for="contenidoC" class="form-label">Contenido:</label>
                <textarea id="contenidoC" name="contenidoC" maxlength="500" required class="form-control textarea-contacto"></textarea>
            </div>

            <div class="text-center">
                <button type="button" onclick="validarContacto()" class="btn btn-dark px-4">Enviar Mensaje</button>
            </div>
        </form>
    </main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/contacto.js') }}" defer></script>
{% endblock %}
