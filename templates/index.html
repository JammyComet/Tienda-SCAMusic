{% extends "base.html" %}

{% block title %}SCAMusica{% endblock %}

{% block contenido %}
<main>
        <section class="info-tienda bg-dark text-white py-4">
            <div class="container-fluid px-4 px-lg-5">
                <div class="row align-items-center g-4">
                    <div class="col-12 col-lg-6">
                        <h2 class="titulo mb-3">
                            <span class="co d-block">PORQUE AMAS LA</span>
                            <span class="musica-grande d-block">MÚSICA</span>
                        </h2>

                        <p class="descripcion fs-5 mb-0">
                            Lo nuevo y lo viejo, todo en una página.
                        </p>
                    </div>

                    <div class="col-12 col-lg-6 text-center text-lg-end">
                        <img src="{{ url_for('static', filename='imagenes/escuchando.jpg') }}" alt="Persona escuchando música" class="img-fluid hero-img">
                    </div>
                </div>
            </div>
        </section>

        <section class="productos container-fluid py-4 px-3">
            <h2 class="text-center mb-4">NUEVOS DISCOS A LA VENTA</h2>

            <div id="carouselDiscos"
                 class="carousel slide mi-carousel"
                 data-bs-ride="carousel"
                 data-bs-interval="3000">

                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img class="d-block w-100"
                             src="{{ url_for('static', filename='imagenes/31Minutos.jpg') }}"
                             alt="31 Minutos">
                    </div>

                    <div class="carousel-item">
                        <img class="d-block w-100"
                             src="{{ url_for('static', filename='imagenes/louder.jpg') }}"
                             alt="Taking Back Sunday - Louder Now">
                    </div>

                    <div class="carousel-item">
                        <img class="d-block w-100"
                             src="{{ url_for('static', filename='imagenes/dangerdays.jpg') }}"
                             alt="My Chemical Romance - Danger Days">
                    </div>

                    <div class="carousel-item">
                        <img class="d-block w-100"
                             src="{{ url_for('static', filename='imagenes/soda.png') }}"
                             alt="Soda Stereo">
                    </div>

                    <div class="carousel-item">
                        <img class="d-block w-100"
                             src="{{ url_for('static', filename='imagenes/marco.jpg') }}"
                             alt="Marco Antonio Solís">
                    </div>

                    <div class="carousel-item">
                        <img class="d-block w-100"
                             src="{{ url_for('static', filename='imagenes/billy.jpeg') }}"
                             alt="Billy Idol">
                    </div>

                    <div class="carousel-item">
                        <img class="d-block w-100"
                             src="{{ url_for('static', filename='imagenes/michael.jpg') }}"
                             alt="Michael Jackson">
                    </div>
                </div>

                <button class="carousel-control-prev"
                        type="button"
                        data-bs-target="#carouselDiscos"
                        data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>

                <button class="carousel-control-next"
                        type="button"
                        data-bs-target="#carouselDiscos"
                        data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Siguiente</span>
                </button>
            </div>
        </section>
    </main>
{% endblock %}
