<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SCAMusica{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">

    {% block head %}{% endblock %}
</head>
<body>

    <header class="site-header bg-white py-2 px-3">
        <div class="container-fluid d-flex flex-wrap align-items-center gap-2">
            <a href="{{ url_for('inicio') }}">
                <img src="{{ url_for('static', filename='imagenes/audifonos.png') }}" alt="Audifonos" class="site-logo img-fluid">
            </a>

            <h1 class="brand-title mb-0 me-lg-3">
                <span class="texto">Lo mejor de lo mejor</span>
                <span class="tienda">SCAMusica</span>
                <span class="virtual">TIENDA VIRTUAL</span>
            </h1>

            <nav class="d-flex flex-wrap align-items-center flex-grow-1 gap-3">
                <div class="d-flex flex-wrap justify-content-center gap-3 mx-auto">
                    <a href="{{ url_for('inicio') }}" class="text-dark text-decoration-none">Home</a>
                    <a href="{{ url_for('productos') }}" class="text-dark text-decoration-none">Productos</a>
                    <a href="{{ url_for('nosotros') }}" class="text-dark text-decoration-none">Nosotros</a>
                    <a href="{{ url_for('blogs') }}" class="text-dark text-decoration-none">Blogs</a>
                    <a href="{{ url_for('contacto') }}" class="text-dark text-decoration-none">Contacto</a>
                </div>

                <div class="d-flex flex-wrap align-items-center gap-2 ms-lg-auto">
                    <a
                        id="enlaceAdmin"
                        href="{{ url_for('admin') }}"
                        class="text-dark text-decoration-none fw-bold d-none">
                        Administración
                    </a>

                    <a
                        id="enlaceVendedor"
                        href="{{ url_for('vendedor') }}"
                        class="text-dark text-decoration-none fw-bold d-none">
                        Vendedor
                    </a>

                    <span id="datosSesion" class="small d-none">
                        👤 Bienvenido, <strong id="nombreSesion"></strong>
                        · <span id="rolSesion"></span>
                    </span>

                    <a
                        id="enlaceLogin"
                        href="{{ url_for('login') }}"
                        class="text-dark text-decoration-none">
                        Iniciar sesión
                    </a>

                    <a
                        id="enlaceRegistro"
                        href="{{ url_for('registro') }}"
                        class="text-dark text-decoration-none">
                        Registrarse
                    </a>

                    <button
                        type="button"
                        id="btnCerrarSesion"
                        class="btn btn-sm btn-outline-dark d-none">
                        Cerrar sesión
                    </button>

                    <a href="{{ url_for('carrito') }}" class="text-dark text-decoration-none fw-bold">
                        🛒 Carrito <span id="contadorCarrito" class="badge bg-dark">0</span>
                    </a>
                </div>
            </nav>
        </div>
    </header>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{ url_for('static', filename='js/validaciones.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/storage.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/carrito.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/sesion.js') }}" defer></script>

    {% block contenido %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
