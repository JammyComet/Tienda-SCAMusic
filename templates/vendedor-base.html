<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vendedor | SCAMusica{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body class="admin-body d-none">

    <div class="container-fluid">
        <div class="row min-vh-100">

            <aside class="col-12 col-md-3 col-lg-2 admin-sidebar p-3 d-flex flex-column">
                <h1 class="h4 fw-bold mb-4">SCAMusica Vendedor</h1>

                <nav class="nav flex-column gap-2">
                    <a href="{{ url_for('vendedor') }}" class="nav-link admin-nav-link">
                        Inicio
                    </a>

                    <a href="{{ url_for('vendedor_productos') }}" class="nav-link admin-nav-link">
                        Productos
                    </a>

                    <a href="{{ url_for('vendedor_ordenes') }}" class="nav-link admin-nav-link">
                        Órdenes
                    </a>

                    <hr>

                    <a href="{{ url_for('inicio') }}" class="nav-link admin-nav-link">
                        Volver a la tienda
                    </a>
                </nav>

                <div class="mt-auto pt-4 small">
                    <p id="vendedorDatosSesion" class="mb-2"></p>
                    <button
                        type="button"
                        id="btnCerrarSesionVendedor"
                        class="btn btn-sm btn-outline-light">
                        Cerrar sesión
                    </button>
                </div>
            </aside>

            <main class="col-12 col-md-9 col-lg-10 p-4 p-lg-5">
                {% block contenido %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/storage.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/vendedor.js') }}" defer></script>

    {% block scripts %}{% endblock %}
</body>
</html>
